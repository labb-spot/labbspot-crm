# No build step — index.html is a single self-contained static file.
# Tailwind loads via CDN at runtime (the precompile experiment didn't help
# perf and broke some utility classes, so it was reverted).
[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Creation-only page for court-records employees (light, fast).
[[redirects]]
  from = "/creation"
  to = "/creation.html"
  status = 200

# Overseas route: /sbx/* is forwarded to Supabase so employees abroad reach the
# database through Netlify's nearby servers (same HTTPS, same keys, same rules).
[[redirects]]
  from = "/sbx/*"
  to = "https://jexytttqozcdtexkxoff.supabase.co/:splat"
  status = 200
  force = true
